<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#667eea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PRIVA" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <title>Sagitarius-Nova (PRIVA)</title>

  <!-- Optional: keep your existing stylesheet -->
  <link rel="stylesheet" href="styles.css?v=A2">

  <!-- Chart.js (if used) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>

  <style>
    /* Minimal styles so the essential UI is usable */
    .hidden { display: none; }
    #platform { padding: 12px; }
    #alertContainer .alert { padding:8px 12px; margin:6px 0; border-radius:6px; color:#fff; }
    .alert.warning { background:#f59e0b; }
    .alert.success { background:#10b981; }
    .alert.danger { background:#ef4444; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .status-bar { display:flex; gap:12px; align-items:center; }
    .tabs { margin-top:12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
    .security-camera-card { background:#0f172a; color:#fff; padding:8px; border-radius:8px; }
    .modal { position:fixed; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.6); z-index:1000; }
    .modal .dialog { background:#fff; color:#000; padding:16px; border-radius:8px; width:320px; max-width:90%; }
    .modal.hidden { display:none; }
    #cameraFullscreenModal img { max-width:90vw; max-height:70vh; display:block; margin:0 auto; }
    .btn { padding:6px 8px; border-radius:6px; cursor:pointer; }
    .btn-small { padding:4px 6px; font-size:14px; }
  </style>
</head>
<body>
  <!-- Homepage -->
  <div id="homepage">
    <div style="padding:40px; text-align:center;">
      <h1>🌍 Sagitarius-Nova</h1>
      <p>Bienvenue — Plateforme PRIVA</p>
      <button class="btn" onclick="enterPlatform()">Accéder à la plateforme</button>
    </div>
  </div>

  <!-- Platform -->
  <div id="platform" class="hidden">
    <div class="header">
      <div class="logo">
        <h2>🌍 Sagitarius-Nova</h2>
      </div>

      <div class="status-bar">
        <div>
          <span id="connectionText">Démarrage...</span>
        </div>
        <div>
          <span>🤖 Mode: <strong id="modeDisplay">--</strong></span>
        </div>
        <div>
          <span>📡 <strong id="dataCount">0</strong> mesures</span>
        </div>
        <div>
          <button class="btn btn-small" onclick="returnHome()">🏠 Accueil</button>
        </div>
      </div>
    </div>

    <!-- Alerts -->
    <div id="alertContainer" aria-live="polite"></div>

    <!-- Controls -->
    <div style="display:flex; gap:8px; margin:8px 0; flex-wrap:wrap;">
      <button id="toggle-auto-detect-btn" class="btn" onclick="toggleAutoDetect()">🤖 Auto: OFF</button>
      <button class="btn" onclick="Priva?.captureAllCameras ? Priva.captureAllCameras() : alert('Priva non chargé')">📸 Capture toutes</button>
      <button class="btn" onclick="Priva?.testAIServer ? Priva.testAIServer() : alert('Priva non chargé')">🔍 Tester IA</button>
      <button class="btn" onclick="openAddCameraModal()">➕ Ajouter Caméra</button>
    </div>

    <!-- IA Info & Stats -->
    <div style="display:flex; gap:12px; align-items:flex-start; margin-bottom:12px; flex-wrap:wrap;">
      <div id="ai-model-info" style="flex:1; min-width:220px;"></div>
      <div id="ai-stats" style="flex:1; min-width:220px;"></div>
      <div id="ai-results-container" style="flex:1; min-width:220px;"></div>
    </div>

    <!-- Cameras grid -->
    <h3>Caméras</h3>
    <div id="security-cameras-grid" class="grid"></div>

    <!-- Captures gallery -->
    <h3>Captures récentes</h3>
    <div id="security-captures-gallery" class="grid"></div>
  </div>

  <!-- Add Camera Modal -->
  <div id="addCameraModal" class="modal hidden" aria-hidden="true">
    <div class="dialog">
      <h3>Ajouter une caméra</h3>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <input id="newCameraName" placeholder="Nom de la caméra" />
        <input id="newCameraIP" placeholder="Adresse IP (ex: 192.168.0.10)" />
        <input id="newCameraLocation" placeholder="Emplacement (optionnel)" />
        <div style="display:flex; gap:8px; justify-content:flex-end;">
          <button class="btn" onclick="submitAddCamera()">Ajouter</button>
          <button class="btn" onclick="closeAddCameraModal()">Annuler</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Fullscreen Camera Modal -->
  <div id="cameraFullscreenModal" class="modal hidden" aria-hidden="true">
    <div class="dialog" style="max-width:900px; width:90%;">
      <h3 id="fullscreen-camera-name">📹</h3>
      <img id="fullscreen-camera-img" src="" alt="Camera fullscreen" />
      <div style="display:flex; gap:8px; justify-content:center; margin-top:8px;">
        <button class="btn" onclick="captureFromFullscreen()">📸</button>
        <button class="btn" onclick="toggleFlashFullscreen()">💡</button>
        <button class="btn" onclick="downloadCapture()">⬇️</button>
        <button class="btn" onclick="closeCameraFullscreen()">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Your (refactored) app script - adjust path if needed -->
  <script src="app.js"></script>

  <!-- Small glue script to manage simple UI actions and bridge to Priva -->
  <script>
    // Show/hide homepage/platform
    function enterPlatform() {
      document.getElementById('homepage').classList.add('hidden');
      document.getElementById('platform').classList.remove('hidden');

      // Initialize Priva if available
      if (window.Priva && typeof window.Priva.init === 'function') {
        window.Priva.init().then(() => {
          window.Priva.initAI && window.Priva.initAI();
          // render current data to DOM
          window.Priva.renderSecurityCameras && window.Priva.renderSecurityCameras();
          window.Priva.renderSecurityCaptures && window.Priva.renderSecurityCaptures();
        });
      } else {
        console.warn('Priva module non disponible (app.js manquant ou non chargé).');
      }
    }

    function returnHome() {
      document.getElementById('platform').classList.add('hidden');
      document.getElementById('homepage').classList.remove('hidden');
    }

    function openAddCameraModal() {
      document.getElementById('addCameraModal').classList.remove('hidden');
      document.getElementById('addCameraModal').ariaHidden = "false";
    }
    function closeAddCameraModal() {
      document.getElementById('addCameraModal').classList.add('hidden');
      document.getElementById('addCameraModal').ariaHidden = "true";
    }
    function submitAddCamera() {
      const name = document.getElementById('newCameraName').value.trim();
      const ip = document.getElementById('newCameraIP').value.trim();
      const location = document.getElementById('newCameraLocation').value.trim();

      if (!name || !ip) {
        showLocalAlert('warning', 'Nom et IP requis');
        return;
      }

      // Prefer using Priva API if available (mobile-friendly adapter)
      if (window.Priva && typeof window.Priva.addSecurityCameraFromParams === 'function') {
        window.Priva.addSecurityCameraFromParams(name, ip, location);
        closeAddCameraModal();
      } else {
        showLocalAlert('danger', 'Module Priva non disponible');
      }
    }

    // Local DOM alert helper (also kept for compatibility with event bridge)
    function showLocalAlert(type, msg) {
      const container = document.getElementById('alertContainer');
      if (!container) return;
      const div = document.createElement('div');
      div.className = 'alert ' + (type || 'warning');
      div.textContent = msg;
      container.appendChild(div);
      setTimeout(() => div.remove(), 5000);
    }

    // Event bridge: listen to Priva EventBus custom events and update DOM
    (function attachPrivaListeners() {
      if (!window.Priva || !window.Priva.EventBus) return;

      try {
        const bus = window.Priva.EventBus;

        // Alerts emitted by the library
        bus.addEventListener && bus.addEventListener('priva:alert', (e) => {
          const detail = e.detail || e;
          showLocalAlert(detail.type, detail.msg);
        });

        // AI detection results
        bus.addEventListener && bus.addEventListener('priva:detection', (e) => {
          const d = e.detail || e;
          const container = document.getElementById('ai-results-container');
          if (!container) return;
          const el = document.createElement('div');
          el.style = "background:#111827;color:#fff;padding:8px;border-radius:6px;margin:6px 0;";
          el.innerHTML = `<strong>${d.cameraName}</strong> — ${d.label} (${(d.confidence||0).toFixed(1)}%)<br><small>${new Date(d.timestamp).toLocaleString()}</small>`;
          container.insertBefore(el, container.firstChild);
        });

        // Render cameras list (mobile UI)
        bus.addEventListener && bus.addEventListener('priva:render-cameras', (e) => {
          const list = e.detail || e;
          const grid = document.getElementById('security-cameras-grid');
          if (!grid) return;
          grid.innerHTML = '';
          list.forEach(cam => {
            const card = document.createElement('div');
            card.className = 'security-camera-card';
            card.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;">
                                <div><strong>📹 ${cam.name}</strong><div style="font-size:12px;color:#9ca3af">${cam.location} • ${cam.ip}</div></div>
                                <div style="display:flex;flex-direction:column;gap:6px">
                                  <button class="btn btn-small" onclick="Priva.captureCamera('${cam.id}','${cam.name}','${cam.ip}')">📸</button>
                                  <button class="btn btn-small" onclick="Priva.captureCameraAndDetect('${cam.id}','${cam.name}','${cam.ip}')">🤖</button>
                                </div>
                              </div>`;
            grid.appendChild(card);
          });
        });

        // Camera frame update (mobile: load image url)
        bus.addEventListener && bus.addEventListener('priva:camera-frame', (e) => {
          const { id, url } = e.detail || e;
          // If there's an <img id="stream-..."> update it, otherwise ignore (mobile UI should fetch)
          const img = document.getElementById('stream-' + id);
          if (img) img.src = url;
        });

        // Render captures
        bus.addEventListener && bus.addEventListener('priva:render-captures', (e) => {
          const captures = e.detail || e;
          const gallery = document.getElementById('security-captures-gallery');
          if (!gallery) return;
          gallery.innerHTML = '';
          (captures || []).slice(0,20).forEach((cap, idx) => {
            const el = document.createElement('div');
            el.className = 'capture-item';
            el.style = 'background:#fff;padding:8px;border-radius:6px;';
            el.innerHTML = `<div><img src="${cap.url}" alt="${cap.name}" style="width:100%;height:auto;"/></div>
                            <div style="font-size:12px;margin-top:6px;">📹 ${cap.name} • ${(new Date(cap.timestamp)).toLocaleTimeString()}</div>`;
            gallery.appendChild(el);
          });
        });
      } catch (err) {
        console.warn('Impossible d\'attacher les listeners Priva:', err);
      }
    })();

    // If app.js is loaded after DOMContentLoaded, try to init automatically
    window.addEventListener('load', () => {
      if (document.getElementById('platform') && !document.getElementById('platform').classList.contains('hidden')) {
        // already in platform view
        if (window.Priva && typeof window.Priva.init === 'function') {
          window.Priva.init();
          window.Priva.initAI && window.Priva.initAI();
        }
      }
    });
  </script>
</body>
</html>
